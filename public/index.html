<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#overview"><span class="mark" aria-hidden="true">SD</span><span>System Design Coach</span></a>
    <nav aria-label="Main" id="nav">
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
      <a href="#interview" data-view="interview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Interview<span class="live-dot" hidden></span></a>
      <a href="#history" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
      <a href="#questions" data-view="questions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Questions</a>
      <a href="#rubric" data-view="rubric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 11l2 2 4-4"/></svg>Rubric</a>
    </nav>
    <div class="rail-foot">
      <label for="target" class="eyebrow">Target role</label>
      <select id="target"></select>
      <p class="rail-note" id="models"></p>
      <p class="rail-note auth" id="auth" aria-live="polite"></p>
    </div>
  </aside>
  <main id="app" class="main" tabindex="-1"><p class="muted">Loading…</p></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
